[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misja-drona"
version = "0.1.0"
description = "Autonomiczna misja drona testowana w symulacji SITL"
requires-python = ">=3.12"
dependencies = ["pymavlink", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]